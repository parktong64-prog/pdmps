<title>PDMPS 홈</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --page-bg:#f6f1ee; --card-bg:#ffffff; --ink:#2a1f22; --ink-soft:#6f6265; --line:#e8e0dd;
    --accent:#a1546a; --accent-soft:#f4e6ea; --accent-ink:#7d3f52;
    --focus-ring:rgba(161,84,106,.28);
    --font-display:'Noto Serif KR',ui-serif,'Nanum Myeongjo',serif;
    --font-body:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#1b1517; --card-bg:#241d20; --ink:#f3ebe9; --ink-soft:#b6a8ac; --line:#3a2f33;
      --accent:#e08aa1; --accent-soft:#3a2530; --accent-ink:#f0aabb; --focus-ring:rgba(224,138,161,.28);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#1b1517; --card-bg:#241d20; --ink:#f3ebe9; --ink-soft:#b6a8ac; --line:#3a2f33;
    --accent:#e08aa1; --accent-soft:#3a2530; --accent-ink:#f0aabb; --focus-ring:rgba(224,138,161,.28);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);color:var(--ink);font-family:var(--font-body);}
  h1,h2,p{text-wrap:balance;margin:0;}

  .wrap{max-width:460px;margin:0 auto;padding:32px 20px 72px;}

  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .logo{font-family:var(--font-display);font-size:1.15rem;font-weight:700;}
  .bell{
    width:30px;height:30px;border-radius:50%;border:1.4px solid var(--line);position:relative;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:.8rem;
  }
  .bell::after{content:"";position:absolute;top:-1px;right:-1px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--page-bg);}

  .banner{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-bottom:26px;}
  .banner b{display:block;font-size:.9rem;color:var(--accent-ink);margin-bottom:3px;}
  .banner span{font-size:.76rem;color:var(--ink-soft);}

  .section-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;margin-bottom:14px;}

  .proc-card{
    display:flex;gap:14px;align-items:center;background:var(--card-bg);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:30px;
  }
  .proc-thumb{
    width:56px;height:56px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--accent-soft),var(--line));
  }
  .proc-info .name{font-size:.92rem;font-weight:700;}
  .proc-info .price{font-family:var(--font-mono);font-size:.86rem;color:var(--accent-ink);font-weight:600;margin-top:4px;}
  .proc-info .price span{font-family:var(--font-body);font-size:.68rem;color:var(--ink-soft);font-weight:400;margin-left:4px;}

  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{
    font:inherit;font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:100px;
    border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .concern-panel{
    background:var(--card-bg);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;
  }
  .concern-panel .c-title{font-size:.92rem;font-weight:700;margin-bottom:8px;}
  .concern-panel .c-body{font-size:.84rem;color:var(--ink-soft);line-height:1.7;}
  .concern-panel .c-tip{
    margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
    font-size:.8rem;color:var(--accent-ink);line-height:1.6;
  }
  .concern-panel .c-tip b{color:var(--ink);}

  .note{font-size:.72rem;color:var(--ink-soft);line-height:1.6;margin:6px 2px 30px;}

  .btn-primary{
    display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-size:.92rem;
    font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:11px;padding:15px 0;
    transition:filter .15s, transform .05s;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:active{transform:scale(.99);}
</style>

<div class="wrap">

  <div class="topline">
    <div class="logo">PDMPS</div>
    <div class="bell">●</div>
  </div>

  <div class="banner">
    <b>가을 Face Lift 상담 주간</b>
    <span>9.8 – 9.30 박동만 원장 직접 상담</span>
  </div>

  <div class="section-title">Face Lift 안내</div>
  <div class="proc-card">
    <div class="proc-thumb"></div>
    <div class="proc-info">
      <div class="name">Face Lift (안면거상술)</div>
      <div class="price">₩27,500,000<span>VAT 포함</span></div>
    </div>
  </div>

  <div class="section-title">이런 분께 추천해요</div>
  <div class="chip-row" id="chip-row">
    <button type="button" class="chip active" data-concern="nasolabial">팔자주름</button>
    <button type="button" class="chip" data-concern="jawline">턱선 처짐</button>
    <button type="button" class="chip" data-concern="neck">목주름</button>
  </div>

  <div class="concern-panel" id="concern-panel"></div>
  <p class="note">위 설명은 일반적인 특징 안내이며, 정확한 원인과 개선 방법은 방문 상담에서 원장이 직접 확인 후 안내합니다.</p>

  <a class="btn-primary" href="https://claude.ai/code/artifact/0b52cf41-ec5e-46f5-ad1a-9de5fdce605a">상담 시작하기</a>
</div>

<script>
(function(){
  const CONCERNS = {
    nasolabial: {
      title: '팔자주름',
      body: '코 옆에서 입가로 이어지는 깊은 주름으로, 나이가 들며 볼과 중안면부가 아래로 처지면서 더 두드러지게 나타납니다.',
      tip: '<b>Face Lift는</b> 처진 볼과 피부를 끌어올려 팔자주름을 완화하는 데 도움을 줄 수 있어요.',
    },
    jawline: {
      title: '턱선 처짐',
      body: '턱과 목의 경계가 흐려지고 갸름했던 라인이 아래로 처지는 현상으로, 피부 아래 근막(SMAS)이 이완되며 나타납니다.',
      tip: '<b>Face Lift는</b> 근막(SMAS)을 끌어올려 고정해 턱선을 선명하게 정리합니다.',
    },
    neck: {
      title: '목주름',
      body: '목 피부와 근육의 탄력이 떨어지며 생기는 가로 또는 세로 주름으로, 나이보다 더 들어 보이게 하는 대표적인 부위예요.',
      tip: '<b>Face Lift에</b> 넥 리프팅을 함께 진행하면 목선 개선에 도움이 됩니다.',
    },
  };

  const chipRow = document.getElementById('chip-row');
  const panel = document.getElementById('concern-panel');

  function render(key) {
    const c = CONCERNS[key];
    panel.innerHTML =
      '<div class="c-title">' + c.title + '</div>' +
      '<div class="c-body">' + c.body + '</div>' +
      '<div class="c-tip">' + c.tip + '</div>';
  }

  chipRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    chipRow.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.concern);
  });

  render('nasolabial');
})();
</script>
