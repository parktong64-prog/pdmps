<title>예약 캘린더</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --page-bg:#f6f1ee;
    --card-bg:#ffffff;
    --ink:#2a1f22;
    --ink-soft:#6f6265;
    --ink-faint:#a99d9f;
    --line:#e8e0dd;
    --accent:#a1546a;
    --accent-soft:#f4e6ea;
    --accent-ink:#7d3f52;
    --focus-ring:rgba(161,84,106,.28);
    --font-display:'Noto Serif KR',ui-serif,'Nanum Myeongjo',serif;
    --font-body:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#1b1517; --card-bg:#241d20; --ink:#f3ebe9; --ink-soft:#b6a8ac; --ink-faint:#6e6062;
      --line:#3a2f33; --accent:#e08aa1; --accent-soft:#3a2530; --accent-ink:#f0aabb;
      --focus-ring:rgba(224,138,161,.28);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#1b1517; --card-bg:#241d20; --ink:#f3ebe9; --ink-soft:#b6a8ac; --ink-faint:#6e6062;
    --line:#3a2f33; --accent:#e08aa1; --accent-soft:#3a2530; --accent-ink:#f0aabb;
    --focus-ring:rgba(224,138,161,.28);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);color:var(--ink);font-family:var(--font-body);}
  h1,h2,p{text-wrap:balance;margin:0;}

  .wrap{max-width:520px;margin:0 auto;padding:48px 20px 96px;}

  .eyebrow{
    font-size:.72rem;letter-spacing:.14em;color:var(--accent-ink);font-weight:700;
    text-transform:uppercase;margin-bottom:10px;
  }
  .hero h1{font-family:var(--font-display);font-size:1.6rem;font-weight:700;margin-bottom:10px;}
  .hero p{font-size:.88rem;color:var(--ink-soft);line-height:1.65;margin-bottom:26px;}

  .card{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:20px;}

  /* ---------- 월 달력 ---------- */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .month-nav button{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card-bg);
    color:var(--ink);font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:disabled{opacity:.3;cursor:not-allowed;}
  .month-nav button:not(:disabled):hover{border-color:var(--accent);}
  .month-label{font-family:var(--font-display);font-size:1.05rem;font-weight:700;}

  .legend{display:flex;gap:16px;font-size:.68rem;color:var(--ink-soft);margin-bottom:14px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;}
  .legend i.off{background:var(--ink-faint);}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .weekday-row span{text-align:center;font-size:.68rem;color:var(--ink-soft);padding:4px 0;}
  .weekday-row span:first-child{color:#c0605f;}

  .day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .day-cell{
    aspect-ratio:1;border-radius:9px;border:none;background:transparent;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:var(--font-mono);font-size:.8rem;cursor:pointer;position:relative;
  }
  .day-cell.blank{cursor:default;}
  .day-cell:not(.blank):not(:disabled):hover{background:var(--accent-soft);}
  .day-cell:disabled{color:var(--ink-faint);cursor:not-allowed;}
  .day-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .day-cell .tag{font-family:var(--font-body);font-size:.52rem;color:var(--ink-faint);}
  .day-cell.today{box-shadow:inset 0 0 0 1.4px var(--accent-ink);}

  /* ---------- 시간 선택 ---------- */
  .back-link{
    font:inherit;font-size:.78rem;color:var(--ink-soft);background:none;border:none;
    cursor:pointer;padding:0;margin-bottom:16px;text-decoration:underline;text-underline-offset:2px;
  }
  .slot-label{font-size:.88rem;font-weight:700;margin-bottom:14px;color:var(--ink);}
  .slot-label span{color:var(--ink-soft);font-weight:400;font-size:.78rem;display:block;margin-top:2px;}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .slot{
    font:inherit;font-family:var(--font-mono);font-size:.82rem;padding:12px 0;border-radius:9px;
    border:1px solid var(--line);background:var(--card-bg);color:var(--ink);cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .slot:hover:not(:disabled){border-color:var(--accent);}
  .slot.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .slot:disabled{color:var(--line);text-decoration:line-through;cursor:not-allowed;background:var(--page-bg);}

  /* ---------- 요약 & CTA ---------- */
  .summary{
    position:sticky;bottom:16px;background:var(--card-bg);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-top:20px;box-shadow:0 18px 40px -24px rgba(42,31,34,.35);
  }
  .summary-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-soft);padding:3px 0;}
  .summary-row b{color:var(--ink);font-weight:600;}
  .btn-primary{
    display:block;width:100%;font:inherit;font-size:.9rem;font-weight:700;color:#fff;background:var(--accent);
    border:none;border-radius:10px;padding:13px 0;cursor:pointer;text-align:center;margin-top:12px;
    transition:filter .15s, transform .05s, opacity .15s;
  }
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.06);}
  .summary-note{font-size:.68rem;color:var(--ink-soft);text-align:center;margin-top:9px;}

  .source-note{font-size:.7rem;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}

  [hidden]{display:none!important;}
</style>

<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Face Lift 전문 · 박동만 원장</div>
    <h1>예약 캘린더</h1>
    <p>병원에서 열어둔 날짜 중 원하는 날을 고르면, 그 날의 예약 가능한 시간을 선택할 수 있어요.</p>
  </div>

  <!-- 월 달력 화면 -->
  <div id="view-month" class="card">
    <div class="month-nav">
      <button type="button" id="prev-month" aria-label="이전 달">‹</button>
      <div class="month-label" id="month-label"></div>
      <button type="button" id="next-month" aria-label="다음 달">›</button>
    </div>
    <div class="legend">
      <span><i></i>예약 가능</span>
      <span><i class="off"></i>휴진 · 마감</span>
    </div>
    <div class="weekday-row">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="day-grid" id="day-grid"></div>
    <p class="source-note">병원 관리자가 등록한 진료 가능 일정 기준입니다. 이후 일정은 순차적으로 열립니다.</p>
  </div>

  <!-- 시간 선택 화면 -->
  <div id="view-time" class="card" hidden>
    <button type="button" class="back-link" id="back-to-month">‹ 다른 날짜 선택</button>
    <div class="slot-label" id="slot-label"></div>
    <div class="slot-grid" id="slot-grid"></div>
  </div>

  <div class="summary" id="summary" hidden>
    <div class="summary-row"><span>시술</span><b>Face Lift</b></div>
    <div class="summary-row"><span>담당</span><b>박동만 원장</b></div>
    <div class="summary-row"><span>일시</span><b id="summary-when"></b></div>
    <button type="button" class="btn-primary" id="next-btn" disabled>다음 · 예약자 정보 입력</button>
    <div class="summary-note">선택한 시간은 결제 전까지 10분간 임시로 잡아드려요</div>
  </div>

</div>

<script>
(function(){
  const WEEKDAY_LABEL = ['일','월','화','수','목','금','토'];

  // 병원이 예약을 열어둔 기간 (실제로는 관리자 대시보드에서 설정 -> API로 조회)
  const MONTHS = [
    { y: 2026, m: 8 },  // 2026년 9월
    { y: 2026, m: 9 },  // 2026년 10월
    { y: 2026, m: 10 }, // 2026년 11월
  ];
  const TODAY = new Date(2026, 8, 5); // 프로토타입 기준 "오늘"

  // 정기 휴진 외에 병원이 별도로 막아둔 날짜 (공휴일/원장 학회 등)
  const BLOCKED = {
    '2026-09-24': '추석연휴',
    '2026-09-25': '추석연휴',
    '2026-09-26': '추석연휴',
    '2026-10-09': '한글날',
  };

  const TIMES = ['10:00', '11:00', '13:00', '14:30', '16:00', '17:30'];

  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function dateKey(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function isBooked(key, time) {
    return hash(key + '_' + time) % 100 < 30;
  }
  function availableTimes(key) {
    return TIMES.filter((t) => !isBooked(key, t));
  }
  function dayStatus(y, m, d) {
    const key = dateKey(y, m, d);
    const date = new Date(y, m, d);
    const weekday = date.getDay();
    if (date < TODAY) return { open: false, reason: null };
    if (weekday === 0 || weekday === 6) return { open: false, reason: '휴' };
    if (BLOCKED[key]) return { open: false, reason: '휴', title: BLOCKED[key] };
    if (availableTimes(key).length === 0) return { open: false, reason: '마감' };
    return { open: true, reason: null };
  }

  let monthIndex = 0; // MONTHS 배열 인덱스
  let selected = null; // { y, m, d, key, weekday, time }

  const monthLabel = document.getElementById('month-label');
  const dayGrid = document.getElementById('day-grid');
  const prevBtn = document.getElementById('prev-month');
  const nextBtn2 = document.getElementById('next-month');
  const viewMonth = document.getElementById('view-month');
  const viewTime = document.getElementById('view-time');
  const slotLabel = document.getElementById('slot-label');
  const slotGrid = document.getElementById('slot-grid');
  const backBtn = document.getElementById('back-to-month');
  const summary = document.getElementById('summary');
  const summaryWhen = document.getElementById('summary-when');
  const nextBtn = document.getElementById('next-btn');

  function renderMonth() {
    const { y, m } = MONTHS[monthIndex];
    monthLabel.textContent = y + '년 ' + (m + 1) + '월';
    prevBtn.disabled = monthIndex === 0;
    nextBtn2.disabled = monthIndex === MONTHS.length - 1;

    dayGrid.innerHTML = '';
    const firstWeekday = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < firstWeekday; i++) {
      const blank = document.createElement('div');
      blank.className = 'day-cell blank';
      dayGrid.appendChild(blank);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const status = dayStatus(y, m, d);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day-cell';
      const isToday = y === TODAY.getFullYear() && m === TODAY.getMonth() && d === TODAY.getDate();
      if (isToday) cell.classList.add('today');
      if (status.title) cell.title = status.title;

      let inner = '<span>' + d + '</span>';
      if (status.open) inner += '<span class="dot"></span>';
      else if (status.reason) inner += '<span class="tag">' + status.reason + '</span>';
      cell.innerHTML = inner;

      cell.disabled = !status.open;
      if (status.open) {
        cell.addEventListener('click', () => openTimeView(y, m, d));
      }
      dayGrid.appendChild(cell);
    }
  }

  function openTimeView(y, m, d) {
    const key = dateKey(y, m, d);
    const weekday = WEEKDAY_LABEL[new Date(y, m, d).getDay()];
    selected = { y, m, d, key, weekday, time: null };

    slotLabel.innerHTML = (m + 1) + '월 ' + d + '일(' + weekday + ')<span>박동만 원장 · 예약 가능 시간</span>';
    renderSlots();

    viewMonth.hidden = true;
    viewTime.hidden = false;
    summary.hidden = false;
    updateSummary();
  }

  function renderSlots() {
    slotGrid.innerHTML = '';
    TIMES.forEach((time) => {
      const booked = isBooked(selected.key, time);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot' + (time === selected.time ? ' selected' : '');
      btn.textContent = booked ? time + ' 마감' : time;
      btn.disabled = booked;
      if (!booked) {
        btn.addEventListener('click', () => {
          selected.time = time;
          renderSlots();
          updateSummary();
        });
      }
      slotGrid.appendChild(btn);
    });
  }

  function updateSummary() {
    if (selected && selected.time) {
      const when = (selected.m + 1) + '월 ' + selected.d + '일(' + selected.weekday + ') ' + selected.time;
      summaryWhen.textContent = when;
      nextBtn.disabled = false;
      nextBtn.dataset.when = when;
    } else {
      summaryWhen.textContent = '';
      nextBtn.disabled = true;
    }
  }

  prevBtn.addEventListener('click', () => { monthIndex = Math.max(0, monthIndex - 1); renderMonth(); });
  nextBtn2.addEventListener('click', () => { monthIndex = Math.min(MONTHS.length - 1, monthIndex + 1); renderMonth(); });

  backBtn.addEventListener('click', () => {
    viewTime.hidden = true;
    viewMonth.hidden = false;
    summary.hidden = true;
    selected = null;
  });

  nextBtn.addEventListener('click', () => {
    if (nextBtn.disabled) return;
    const when = nextBtn.dataset.when || '';
    window.location.href = 'https://claude.ai/code/artifact/f7f23bf5-cf68-4251-af89-d89063128c8c?when=' + encodeURIComponent(when);
  });

  renderMonth();
})();
</script>
